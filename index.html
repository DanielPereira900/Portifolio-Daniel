<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio - Daniel Pereira</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #fff; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* Card do Perfil */
        .profile-card { 
            background-color: #1e293b; 
            border-radius: 16px; 
            padding: 35px 20px; 
            text-align: center; 
            margin-bottom: 30px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); 
        }
        
        /* Foto de Perfil com Borda Brilhante (Glow Neon) */
        .profile-card img.avatar { 
            width: 150px; 
            height: 150px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 4px solid #3b82f6; 
            box-shadow: 0 0 20px #3b82f6, 0 0 35px rgba(59, 130, 246, 0.5); 
            margin-bottom: 15px; 
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .profile-card img.avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #60a5fa, 0 0 50px rgba(96, 165, 250, 0.8);
        }

        .profile-info h2 { font-size: 2rem; margin-bottom: 5px; color: #f8fafc; }
        .profile-info p { color: #94a3b8; font-size: 1.1rem; }
        
        .actions { margin-top: 25px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .btn { padding: 12px 26px; border-radius: 8px; text-decoration: none; color: white; font-weight: bold; background: #25d366; display: inline-flex; align-items: center; gap: 10px; transition: transform 0.2s; }
        .btn:hover { transform: translateY(-2px); }
        .btn-email { background: #ea4335; }
        
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; padding-bottom: 10px; border-bottom: 1px solid #334155; }
        .badge-count { background: #3b82f6; padding: 6px 14px; border-radius: 20px; font-size: 0.9em; font-weight: bold; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        
        /* Grid e Efeito Brilhante nos Cards dos Certificados */
        .certificates-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .cert-wrapper { 
            background: #1e293b; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid #334155; 
            min-height: 200px;
            transition: all 0.3s ease;
        }
        .cert-wrapper:hover {
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            transform: translateY(-4px);
        }
        .cert-img { width: 100%; height: 200px; object-fit: cover; display: block; }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            <!-- Foto com borda brilhante integrada -->
            <img src="img/perfil.jpg" id="avatarImg" alt="Daniel Pereira" class="avatar">
            
            <div class="profile-info">
                <h2>Daniel Pereira</h2>
                <p>Desenvolvedor / Analista de Sistemas</p>
            </div>

            <div class="actions">
                <a href="https://wa.me/5516991789327?text=Olá%20Daniel,%20vim%20pelo%20seu%20portfolio" class="btn" target="_blank">
                    <i class="fa-brands fa-whatsapp"></i> (16) 99178-9327
                </a>
                <a href="mailto:danielj.pereira2@gmail.com" class="btn btn-email">
                    <i class="fa-solid fa-paper-plane"></i> Entrar em Contato
                </a>
            </div>
        </div>

        <div class="section-header">
            <h2><i class="fa-solid fa-award"></i> Meus Certificados e Projetos</h2>
            <span class="badge-count">84 itens</span>
        </div>

        <div class="certificates-grid" id="certificatesgrid"></div>
    </div>

    <script>
        // Carrega foto de perfil (testa com ou sem pasta img)
        const avatar = document.getElementById('avatarImg');
        const tentativasPerfil = ['img/perfil.jpg', 'perfil.jpg', 'img/perfil.png', 'perfil.png'];
        let idxPerfil = 0;
        avatar.onerror = function() {
            idxPerfil++;
            if (idxPerfil < tentativasPerfil.length) {
                this.src = tentativasPerfil[idxPerfil];
            }
        };

        // Carrega automaticamente os 84 certificados numerados em .jpg
        const grid = document.getElementById('certificatesgrid');
        const TOTAL_CERTIFICADOS = 84;

        for (let i = 1; i <= TOTAL_CERTIFICADOS; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = 'cert-wrapper';

            const img = document.createElement('img');
            img.className = 'cert-img';
            img.loading = 'lazy';
            img.src = `img/certificado${i}.jpg`;

            // Caso algum número não exista ou seja a antiga foto de perfil, remove o quadro em branco
            img.onerror = function() {
                wrapper.remove();
            };

            wrapper.appendChild(img);
            grid.appendChild(wrapper);
        }
    </script>
</body>
</html>
