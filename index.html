<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio - Daniel de Jesus Pereira</title>
    
    <!-- Biblioteca para gerar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Ícones (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        #portfolio-content {
            background-color: #ffffff;
            width: 100%;
            max-width: 1000px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Perfil Header */
        .profile-header {
            text-align: center;
            border-bottom: 2px solid #eaeeef;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .avatar-container img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #007bff;
            margin-bottom: 15px;
        }

        .profile-header h1 {
            font-size: 26px;
            color: #1a1a1a;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }

        /* Botões de Contato e PDF */
        .contact-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-whatsapp { background-color: #25d366; color: #fff; }
        .btn-email { background-color: #007bff; color: #fff; }
        .btn-pdf { background-color: #dc3545; color: #fff; }

        /* Contador */
        .cert-counter {
            margin: 25px 0 15px 0;
            font-size: 18px;
            font-weight: bold;
            color: #007bff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Grid da Galeria */
        .grid-certificados {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .cert-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .cert-card:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .cert-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
        }

        .cert-card p {
            padding: 8px;
            font-size: 12px;
            text-align: center;
            background: #f8f9fa;
            color: #555;
            font-weight: bold;
        }

        /* Modal (Zoom na imagem) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 90%;
            max-height: 85%;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Ajustes de Impressão/PDF */
        @media print {
            body { background: #fff; padding: 0; }
            #portfolio-content { box-shadow: none; max-width: 100%; padding: 0; }
            .contact-buttons, .close-btn { display: none !important; }
            .grid-certificados { grid-template-columns: repeat(2, 1fr); page-break-inside: auto; }
            .cert-card { page-break-inside: avoid; }
        }
    </style>
</head>
<body>

    <div id="portfolio-content">
        <!-- Cabeçalho / Perfil -->
        <header class="profile-header">
            <div class="avatar-container">
                <!-- Foto ajustada para o diretório raiz -->
                <img src="perfil.jpg" alt="Foto de Daniel de Jesus Pereira" onerror="this.src='perfiljpg.png'">
            </div>
            <h1>Daniel de Jesus Pereira</h1>
            <p class="subtitle">Desenvolvedor / Analista de Sistemas</p>

            <!-- Botões de Ação Direta -->
            <div class="contact-buttons">
                <a href="https://wa.me/5516991768327" target="_blank" class="btn btn-whatsapp">
                    <i class="fab fa-whatsapp"></i> (16) 99176-8327
                </a>
                <a href="mailto:Danielj.pereira2@gmail.com" class="btn btn-email">
                    <i class="fas fa-envelope"></i> Danielj.pereira2@gmail.com
                </a>
                <a href="mailto:Danieldejesus.pereira86@gmail.com" class="btn btn-email">
                    <i class="fas fa-envelope"></i> Danieldejesus.pereira86@gmail.com
                </a>
                <button onclick="baixarPDF()" class="btn btn-pdf">
                    <i class="fas fa-file-pdf"></i> Baixar PDF
                </button>
            </div>
        </header>

        <main>
            <!-- Contador -->
            <div class="cert-counter">
                <i class="fas fa-certificate"></i>
                <span>Certificados e Projetos (<span id="total-certificados">114</span>)</span>
            </div>

            <!-- Galeria Ondes os 114 Certificados Serão Gerados -->
            <div id="galeria-certificados" class="grid-certificados"></div>
        </main>
    </div>

    <!-- Modal para Ampliar Imagem -->
    <div id="modal" class="modal" onclick="fecharModal()">
        <span class="close-btn">&times;</span>
        <img class="modal-content" id="img-ampliada" alt="Certificado Ampliado">
    </div>

    <script>
        // Configuração dos 114 Certificados
        const TOTAL_CERTIFICADOS = 114;
        const galeria = document.getElementById('galeria-certificados');

        // Geração automática dos 114 elementos no HTML
        for (let i = 1; i <= TOTAL_CERTIFICADOS; i++) {
            const card = document.createElement('div');
            card.className = 'cert-card';
            
            // Tenta carregar no padrão "certificado1.jpg" ou "1.jpg" / "38.jpg"
            const nomeArquivo = `certificado${i}.jpg`;
            const nomeAlternativo = `${i}.jpg`;

            card.innerHTML = `
                <img src="${nomeArquivo}" 
                     alt="Certificado ${i}" 
                     loading="lazy"
                     onerror="this.onerror=null; this.src='${nomeAlternativo}';"
                     onclick="ampliarImagem(this.src)">
                <p>Certificado #${i}</p>
            `;
            galeria.appendChild(card);
        }

        // Função do Zoom (Modal)
        function ampliarImagem(src) {
            const modal = document.getElementById('modal');
            const imgAmpliada = document.getElementById('img-ampliada');
            modal.style.display = 'flex';
            imgAmpliada.src = src;
        }

        function fecharModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // Função para Gerar o PDF
        function baixarPDF() {
            const elemento = document.getElementById('portfolio-content');
            const opcoes = {
                margin:       10,
                filename:     'Portfólio_Daniel_de_Jesus_Pereira.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opcoes).from(elemento).save();
        }
    </script>
</body>
</html>
