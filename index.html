<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel J. Pereira - Portfólio & Certificados</title>
    
    <!-- Fontes do Google (Poppins) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Ícones FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 20px 30px -10px rgba(37, 99, 235, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        /* Banner de Fundo Topo */
        .header-bg {
            height: 220px;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #93c5fd 100%);
            width: 100%;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Card de Perfil */
        .profile-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 35px 25px;
            margin-top: -90px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .profile-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.6rem;
            font-weight: 700;
            border: 4px solid var(--card-bg);
            box-shadow: 0 6px 16px rgba(0,0,0,0.12);
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .profile-name {
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .profile-title {
            font-size: 1rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 18px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .profile-info {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 22px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .profile-info-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-info-item i {
            color: var(--primary);
            font-size: 1.1rem;
        }

        .actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 26px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            box-shadow: 0 4px 14px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp:hover {
            background-color: #1eb956;
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.4);
        }

        .btn-email {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }

        .btn-email:hover {
            background-color: var(--primary-hover);
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.4);
        }

        /* Seção de Titulo */
        .section-header {
            margin: 50px 0 25px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--primary);
        }

        .badge-count {
            background: #e0e7ff;
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 600;
        }

        /* Grid dos Certificados */
        .certificates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 22px;
        }

        .cert-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .cert-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: #93c5fd;
        }

        .cert-img-wrapper {
            position: relative;
            width: 100%;
            padding-top: 75%;
            background-color: #f1f5f9;
            overflow: hidden;
        }

        .cert-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .cert-card:hover .cert-img {
            transform: scale(1.05);
        }

        .cert-info {
            padding: 14px;
            text-align: center;
            background: var(--card-bg);
            border-top: 1px solid #f1f5f9;
        }

        .cert-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Responsividade para Celulares */
        @media (max-width: 640px) {
            .certificates-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 14px;
            }
            .profile-card {
                padding: 25px 15px;
            }
            .profile-name {
                font-size: 1.5rem;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Topo / Banner -->
    <div class="header-bg"></div>

    <div class="container">
        <!-- Card do Desenvolvedor -->
        <div class="profile-card">
            <div class="profile-avatar">DP</div>
            <h1 class="profile-name">Daniel J. Pereira</h1>
            <p class="profile-title">Desenvolvedor Front-End</p>
            
            <div class="profile-info">
                <div class="profile-info-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>Franca, São Paulo</span>
                </div>
                <div class="profile-info-item">
                    <i class="fa-solid fa-envelope"></i>
                    <span>Daniel.pereira2@gmail.com</span>
                </div>
            </div>

            <div class="actions">
                <a href="https://wa.me/5516991768327?text=Olá%20Daniel,%20vi%20o%20seu%20portfólio!" target="_blank" class="btn btn-whatsapp">
                    <i class="fa-brands fa-whatsapp"></i> (16) 99176-8327
                </a>
                <a href="mailto:Daniel.pereira2@gmail.com" class="btn btn-email">
                    <i class="fa-solid fa-paper-plane"></i> Entrar em Contato
                </a>
            </div>
        </div>

        <!-- Seção Meus Certificados -->
        <div class="section-header">
            <h2 class="section-title">
                <i class="fa-solid fa-award"></i> Meus Certificados
            </h2>
            <span class="badge-count">76 Certificados</span>
        </div>

        <!-- Galeria Gerada Automaticamente -->
        <div class="certificates-grid" id="certificatesGrid"></div>
    </div>

    <!-- Script Inteligente para carregar as fotos -->
    <script>
        const grid = document.getElementById('certificatesGrid');
        const totalCertificados = 76;

        for (let i = 1; i <= totalCertificados; i++) {
            const card = document.createElement('div');
            card.className = 'cert-card';

            const wrapper = document.createElement('div');
            wrapper.className = 'cert-img-wrapper';

            const img = document.createElement('img');
            img.className = 'cert-img';
            img.alt = `Certificado ${i}`;
            img.loading = 'lazy';

            // Tenta .jpg primeiro, se não encontrar tenta .png
            img.src = `img/certificado${i}.jpg`;
            img.onerror = function() {
                if (!this.dataset.retried) {
                    this.dataset.retried = 'true';
                    this.src = `img/certificado${i}.png`;
                }
            };

            const info = document.createElement('div');
            info.className = 'cert-info';
            info.innerHTML = `<p class="cert-title">Certificado #${i}</p>`;

            wrapper.appendChild(img);
            card.appendChild(wrapper);
            card.appendChild(info);
            grid.appendChild(card);
        }
    </script>
</body>
</html>
