<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio - Daniel Pereira</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #fff; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .profile-card { background-color: #1e293b; border-radius: 12px; padding: 30px 20px; text-align: center; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3); }
        .profile-card img.avatar { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 4px solid #3b82f6; margin-bottom: 15px; }
        .profile-info h2 { font-size: 1.8rem; margin-bottom: 5px; }
        .profile-info p { color: #94a3b8; font-size: 1rem; }
        .actions { margin-top: 20px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .btn { padding: 12px 24px; border-radius: 8px; text-decoration: none; color: white; font-weight: bold; background: #25d366; display: inline-flex; align-items: center; gap: 10px; }
        .btn-email { background: #ea4335; }
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; padding-bottom: 10px; border-bottom: 1px solid #334155; }
        .badge-count { background: #3b82f6; padding: 6px 14px; border-radius: 20px; font-size: 0.9em; font-weight: bold; }
        .certificates-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .cert-wrapper { background: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid #334155; min-height: 200px; }
        .cert-img { width: 100%; height: 200px; object-fit: cover; display: block; }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            <img src="perfil.jpg" id="avatarImg" alt="Daniel Pereira" class="avatar">
            
            <div class="profile-info">
                <h2>Daniel Pereira</h2>
                <p>Desenvolvedor / Analista de Sistemas</p>
            </div>

            <div class="actions">
                <a href="https://wa.me/5516991789327?text=Olá%20Daniel,%20vim%20pelo%20seu%20portfolio" class="btn" target="_blank">
                    <i class="fa-brands fa-whatsapp"></i> (16) 99178-9327
                </a>
                <a href="mailto:danielj.pereira2@gmail.com" class="btn btn-email">
                    <i class="fa-solid fa-paper-plane"></i> Entrar em Contato
                </a>
            </div>
        </div>

        <div class="section-header">
            <h2><i class="fa-solid fa-award"></i> Meus Certificados e Projetos</h2>
            <span class="badge-count">84 itens</span>
        </div>

        <div class="certificates-grid" id="certificatesgrid"></div>
    </div>

    <script>
        const avatar = document.getElementById('avatarImg');
        const tentativasPerfil = ['perfil.jpg', 'img/perfil.jpg', 'perfil.jpg.png', 'perfil.png'];
        let idxPerfil = 0;
        avatar.onerror = function() {
            idxPerfil++;
            if (idxPerfil < tentativasPerfil.length) {
                this.src = tentativasPerfil[idxPerfil];
            }
        };

        const grid = document.getElementById('certificatesgrid');
        
        // Mapeamento dos banners de serviço com nomes especiais
        const bannersEspeciais = [
            '16308.png', '16309.png', '16310.png', 
            '16311.png', '16312.png', '16313.png', '16317.png',
            'img/16308.png', 'img/16309.png', 'img/16310.png', 
            'img/16311.png', 'img/16312.png', 'img/16313.png', 'img/16317.png'
        ];

        function adicionarImagem(listaTentativas) {
            const wrapper = document.createElement('div');
            wrapper.className = 'cert-wrapper';

            const img = document.createElement('img');
            img.className = 'cert-img';
            img.loading = 'lazy';

            let index = 0;
            img.src = listaTentativas[index];

            img.onerror = function() {
                index++;
                if (index < listaTentativas.length) {
                    this.src = listaTentativas[index];
                } else {
                    wrapper.remove();
                }
            };

            wrapper.appendChild(img);
            grid.appendChild(wrapper);
        }

        // 1. Carrega primeiro as artes e banners de serviços
        bannersEspeciais.forEach(banner => {
            adicionarImagem([banner, `img/${banner}`]);
        });

        // 2. Carrega a sequência padrão de certificados de 1 a 84
        const TOTAL_CERTIFICADOS = 84;
        for (let i = 1; i <= TOTAL_CERTIFICADOS; i++) {
            const tentativas = [
                `certificado${i}.jpg`,
                `img/certificado${i}.jpg`,
                `certificado${i}.png`,
                `img/certificado${i}.png`,
                `certificado${i}.jpg.png`,
                `${i}.jpg`,
                `img/${i}.jpg`
            ];
            adicionarImagem(tentativas);
        }
    </script>
</body>
</html>
