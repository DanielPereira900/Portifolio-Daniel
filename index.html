<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio - Daniel de Jesus Pereira</title>
    
    <!-- Biblioteca html2pdf para geração de PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .btn-pdf {
            background-color: #008cba;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.3s;
        }

        .btn-pdf:hover {
            background-color: #005f73;
        }

        /* Grid da Galeria de Certificados */
        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .cert-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
        }

        .cert-card:hover {
            transform: translateY(-5px);
        }

        .cert-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            background-color: #2a2a2a;
        }

        .cert-card p {
            margin-top: 10px;
            font-weight: bold;
            font-size: 14px;
            color: #cccccc;
        }

        /* Modal para ampliar imagem */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }

        .modal .fechar {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="portfolio-content">
        <header>
            <h1>Portfólio de Certificados</h1>
            <p>Daniel de Jesus Pereira</p>
            <button class="btn-pdf" onclick="baixarPDF()">Baixar Portfólio em PDF</button>
        </header>

        <!-- Galeria onde os certificados serão inseridos -->
        <div class="galeria" id="galeria-certificados"></div>
    </div>

    <!-- Modal para visualização ampliada -->
    <div id="modal" class="modal" onclick="fecharModal()">
        <span class="fechar">&times;</span>
        <img id="img-ampliada" src="" alt="Certificado Ampliado">
    </div>

    <script>
        const TOTAL_CERTIFICADOS = 114;
        const galeria = document.getElementById('galeria-certificados');

        function carregarCertificado(index) {
            const card = document.createElement('div');
            card.className = 'cert-card';

            // Lista com todas as combinações possíveis de nome e extensão
            const tentativas = [
                `Certificado${index}.jpg`,
                `Certificado${index}.png`,
                `Certificado${index}.jpeg`,
                `certificado${index}.jpg`,
                `certificado${index}.png`,
                `certificado${index}.jpeg`,
                `Certificado ${index}.jpg`,
                `Certificado ${index}.png`,
                `certificado ${index}.jpg`,
                `certificado ${index}.png`,
                `Certificado${index}.JPG`,
                `Certificado${index}.PNG`,
                `certificado${index}.JPG`,
                `certificado${index}.PNG`,
                `${index}.jpg`,
                `${index}.png`
            ];

            let tentativaAtual = 0;

            const img = document.createElement('img');
            img.src = tentativas[0];
            img.alt = `Certificado #${index}`;
            img.loading = 'lazy';

            // Caso a imagem falhe ao carregar, tenta a próxima opção da lista
            img.onerror = function() {
                tentativaAtual++;
                if (tentativaAtual < tentativas.length) {
                    this.src = tentativas[tentativaAtual];
                }
            };

            img.onclick = function() {
                ampliarImagem(this.src);
            };

            card.appendChild(img);

            const p = document.createElement('p');
            p.innerText = `Certificado #${index}`;
            card.appendChild(p);

            galeria.appendChild(card);
        }

        // Gera os cards do certificado 1 até o 114
        for (let i = 1; i <= TOTAL_CERTIFICADOS; i++) {
            carregarCertificado(i);
        }

        function ampliarImagem(src) {
            const modal = document.getElementById('modal');
            const imgAmpliada = document.getElementById('img-ampliada');
            modal.style.display = 'flex';
            imgAmpliada.src = src;
        }

        function fecharModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function baixarPDF() {
            const elemento = document.getElementById('portfolio-content');
            const opcoes = {
                margin:       10,
                filename:     'Portfolio_Daniel_de_Jesus_Pereira.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opcoes).from(elemento).save();
        }
    </script>
</body>
</html>
